services:
  mongodb:
    image: mongo:7
    container_name: fraudguard-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - fraudguard_mongo:/data/db

  backend:
    build: ./backend
    container_name: fraudguard-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/fraudguard
      JWT_SECRET: change-this-demo-secret
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    container_name: fraudguard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  fraudguard_mongo:
